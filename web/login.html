<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Anmelden · Lagezentrum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="login.css">
</head>
<body>
<main>
  <form class="card" id="loginForm" autocomplete="on">
    <img src="favicon.svg" alt="" width="48" height="48">
    <div class="kicker">Nur für Befugte</div>
    <h1>Lagezentrum</h1>
    <!-- Für Passwortmanager: fester Benutzername, damit sie das Passwort zuordnen können -->
    <input type="text" name="username" value="lagezentrum" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true" readonly>
    <label for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus maxlength="1024">
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="go">Anmelden</button>
    <small>Dieser Browser bleibt angemeldet – bei regelmäßiger Nutzung praktisch dauerhaft, sonst 400 Tage.</small>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>

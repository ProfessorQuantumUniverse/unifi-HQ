name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every service in docker-compose.yml that has a build: section
        service: [api, collector]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: lagezentrum-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Dummy .env from .env.example
        run: cp .env.example .env

      - name: docker compose config
        run: docker compose config -q

      # Catches image tags (e.g. from Dependabot bumps) that do not exist.
      - name: Pull prebuilt images
        run: docker compose pull --ignore-buildable --quiet

      - name: Caddyfile validates with the pinned Caddy image
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: geoip image has what geoip-update.sh needs
        run: |
          docker compose run --rm --no-deps geoip sh -c '
            sh -n /update.sh
            for tool in wget gunzip find date mv chmod; do
              command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
            done
            echo "geoip image OK"'

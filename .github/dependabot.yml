# Dependabot: schlägt Updates als Pull Request vor (nichts wird automatisch übernommen).
# Die Versionen im Projekt sind bewusst festgenagelt – jede PR vor dem Mergen prüfen
# (z. B. goflow2: neue Major-Versionen ändern das JSON-Format).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: monthly

  # Basis-Images der eigenen Dockerfiles. Achtung: Versionen, die per ARG gesetzt werden
  # (Vector, GoFlow2 im collector/Dockerfile), erkennt Dependabot womöglich nicht.
  - package-ecosystem: docker
    directories:
      - /api
      - /collector
    schedule:
      interval: monthly

  # Images in docker-compose.yml (Caddy, VictoriaLogs, Alpine)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly

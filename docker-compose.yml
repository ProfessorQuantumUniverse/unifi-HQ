# Lagezentrum – Live-Weltkarte für UniFi-Flows
#
#   Start:      ./lagezentrum.sh setup   (einmalig)   danach   docker compose up -d
#   Dashboard:  http://<LXC-IP>:8080        Demo: http://<LXC-IP>:8080/?demo
#
# Alle Dienste laufen im Host-Netz des LXC:
#   - UDP 2055 (NetFlow/IPFIX) und UDP 5514 (Syslog) nehmen nur Pakete vom Gateway an
#   - TCP 8080 (Dashboard) beantwortet nur Clients aus dem lokalen Netz, mit Login
#   - VictoriaLogs (9428), der Live-Stream (8090) und GoFlow2-Metriken (8091)
#     hören nur auf 127.0.0.1 und sind von außen nicht erreichbar
# Kein Docker-NAT, kein docker-proxy, Absender-IPs bleiben erhalten.

name: lagezentrum

x-hardening: &hardening
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local            # Docker rotiert selbst
    options:
      max-size: "5m"
      max-file: "2"

services:
  # Einmal-Job: lädt die DB-IP-Lite-Datenbanken, falls sie fehlen oder älter als 32 Tage sind
  geoip:
    <<: *hardening
    image: alpine:3.24
    restart: "no"
    cap_add: [DAC_OVERRIDE]
    command: ["/bin/sh", "/update.sh"]
    environment:
      GEOIP_MAX_AGE_DAYS: ${GEOIP_MAX_AGE_DAYS:-32}
    volumes:
      - ./scripts/geoip-update.sh:/update.sh:ro
      - ./geoip:/geoip
    mem_limit: 128m

  # Historie: Log-Datenbank, komprimiert stark, braucht wenig RAM
  victorialogs:
    <<: *hardening
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -httpListenAddr=127.0.0.1:9428
      - -storageDataPath=/vlogs
      - -retentionPeriod=${RETENTION:-90d}
      - -retention.maxDiskSpaceUsageBytes=${MAX_DISK:-20GiB}
      - -inmemoryDataFlushInterval=30s      # seltener auf die SSD schreiben
      - -loggerLevel=WARN
      - -search.maxQueryDuration=60s
    volumes:
      - vlogs-data:/vlogs
    mem_limit: 512m

  # Pipeline: GoFlow2 (eingebaut) + Syslog -> GeoIP -> VictoriaLogs + Live-Stream
  collector:
    <<: *hardening
    build: ./collector
    image: lagezentrum-collector:local
    env_file: .env
    environment:
      VECTOR_LOG: ${VECTOR_LOG:-warn}
      VECTOR_THREADS: ${VECTOR_THREADS:-1}   # 1 Thread spart ~30 % CPU, reicht für >2000 Flows/s
    volumes:
      - ./collector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./config:/etc/vector/config:ro      # Ordner statt Datei: Änderungen der API kommen an
      - ./geoip:/geoip:ro
    tmpfs:
      - /var/lib/vector:uid=65534,gid=65534,size=16m
    depends_on:
      geoip:
        condition: service_completed_successfully
      victorialogs:
        condition: service_started
    mem_limit: 384m

  # Kleine API fürs Dashboard: Login prüfen, Gerätenamen speichern (config/hosts.csv)
  # und Vector neu laden lassen
  api:
    <<: *hardening
    build: ./api
    image: lagezentrum-api:local
    user: "0:0"
    cap_add: [KILL]                  # nur für SIGHUP an Vector, der als nobody läuft
    pid: "service:collector"         # sieht den Vector-Prozess
    environment:
      HOSTS_FILE: /config/hosts.csv
      LISTEN: 127.0.0.1:8092
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}   # ./lagezentrum.sh password
      AUTH_SECRET: ${AUTH_SECRET:-}
    volumes:
      - ./config:/config
    depends_on: [collector]
    mem_limit: 32m

  # Webserver: Dashboard + /ws (Live) + /select (Abfragen), nur fürs lokale Netz
  caddy:
    <<: *hardening
    image: caddy:2.11-alpine
    cap_add: [NET_BIND_SERVICE]
    environment:
      HTTP_PORT: ${HTTP_PORT:-8080}
      ALLOWED_CLIENTS: ${ALLOWED_CLIENTS:-private_ranges}
      HOME_LAT: ${HOME_LAT:-50.11}
      HOME_LON: ${HOME_LON:-8.68}
      HOME_LABEL: ${HOME_LABEL:-Zuhause}
      GATEWAY_NAME: ${GATEWAY_NAME:-Gateway}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/auth:/etc/caddy/auth:ro
      - ./web:/srv:ro
    tmpfs:
      - /data:size=1m
      - /config:size=1m
    depends_on: [collector, victorialogs, api]
    mem_limit: 64m

volumes:
  vlogs-data:
